<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}SRE Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  {% block extra_css %}{% endblock %}
  <link rel="stylesheet" href="/static/css/custom.css" />
</head>
<body>
<div id="wrapper">

  <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
  <nav id="sidebar">
    <div class="sidebar-brand">
      <a href="/">
        <i class="bi bi-shield-shaded brand-icon"></i>
        <span class="brand-text">SRE Dashboard</span>
      </a>
    </div>

    <ul class="nav flex-column sidebar-nav mt-1">
      <li class="nav-item">
        <a class="nav-link" href="/" data-path="/">
          <i class="bi bi-house-door"></i>
          <span class="nav-label">Home</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-section-label">Technical Reference</div>
    <ul class="nav flex-column sidebar-nav">
      <li class="nav-item">
        <a class="nav-link" href="/trm" data-path="/trm">
          <i class="bi bi-table"></i>
          <span class="nav-label">Inventory</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/trm/visualization" data-path="/trm/visualization">
          <i class="bi bi-bar-chart-line"></i>
          <span class="nav-label">Visualization</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-section-label">Coming Soon</div>
    <ul class="nav flex-column sidebar-nav">
      <li class="nav-item">
        <a class="nav-link text-muted disabled" href="#" tabindex="-1">
          <i class="bi bi-activity"></i>
          <span class="nav-label">Incident Tracker</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-muted disabled" href="#" tabindex="-1">
          <i class="bi bi-clipboard-check"></i>
          <span class="nav-label">Change Management</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- ── Main content ─────────────────────────────────────────────────── -->
  <div id="page-content-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <button class="btn btn-sm btn-outline-secondary" id="sidebarToggle" title="Toggle sidebar">
        <i class="bi bi-list fs-5"></i>
      </button>
      <h1 class="topbar-title">{% block page_title %}{% endblock %}</h1>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2">SRE</span>
        <i class="bi bi-person-circle fs-4 text-secondary"></i>
      </div>
    </header>

    <!-- Content -->
    <main class="content-area">
      {% block content %}{% endblock %}
    </main>

  </div><!-- /page-content-wrapper -->
</div><!-- /wrapper -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
<script>
  // Sidebar toggle
  document.getElementById('sidebarToggle').addEventListener('click', function () {
    document.getElementById('wrapper').classList.toggle('sidebar-collapsed');
  });

  // Active nav link
  const path = window.location.pathname;
  document.querySelectorAll('.sidebar-nav .nav-link[data-path]').forEach(link => {
    const lp = link.getAttribute('data-path');
    const active = lp === '/trm/visualization'
      ? path.startsWith('/trm/visualization')
      : lp === '/trm'
        ? (path === '/trm' || path === '/trm/' || (path.startsWith('/trm/') && !path.startsWith('/trm/visualization') && !path.startsWith('/trm/stats')))
        : path === lp;
    if (active) link.classList.add('active');
  });
</script>
</body>
</html>
